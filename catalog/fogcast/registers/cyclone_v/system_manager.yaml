name: cyclone_v_system_manager
description: Observed Cyclone V HPS system-manager register slice used by Main_MiSTer.
register:
  - name: FPGAINTF
    type: rw
    width: 32
    default: 0x00000000
    offset: 0x00000028
    description: FPGA interface selection register used by Main_MiSTer.
    field:
      - name: VALUE
        bits: "31:0"
        type: rw
        shortdesc: Observed 32-bit register value.
  - name: ISWGRP0
    type: rw
    width: 32
    default: 0x00000000
    offset: 0x00000080
    description: First software handoff-group register used by Main_MiSTer.
    field:
      - name: VALUE
        bits: "31:0"
        type: rw
        shortdesc: Observed 32-bit register value.
