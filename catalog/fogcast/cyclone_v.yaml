definition:
  - type: soc.altera.cyclone_v
    soc: cyclone_v
    buses:
      - name: hps_to_fpga
        supplier: true
        protocol: axi
        prefix: hps_to_fpga
        base_address: 0xff200000
        data_width: 32
        address_width: 25
        fixed_base_address: true
      - name: fpga_core_memory
        supplier: true
        protocol: axi
        prefix: fpga_core_memory
        base_address: 0x20000000
        data_width: 32
        address_width: 29
        fixed_base_address: true

  - type: cpu.arm.cyclone_v
    triple: arm-none-linux-gnueabihf
    arch: armv7
    width: 32
    core_count: 2
    max_atomic_width: 64
    max_bitop_type_width: 32
    # Main_MiSTer maps the complete Cyclone V HPS register aperture rather
    # than only the individual banks it touches. It also maps the FPGA shared
    # memory alias used by fpga_mem()/shmem_map(). These are physical windows,
    # not claims that every byte is a register.
    memory_windows:
      - name: HPS_REG_APERTURE
        base_address: 0xff000000
        size: 0x01000000
        data_width: 32
        address_width: 24
      - name: FPGA_CORE_MEMORY
        base_address: 0x20000000
        size: 0x20000000
        data_width: 32
        address_width: 29
    buses:
      - name: hps_to_fpga
        supplier: false
        protocol: axi
        prefix: hps_to_fpga
        data_width: 32
        address_width: 25
      - name: fpga_core_memory
        supplier: false
        protocol: axi
        prefix: fpga_core_memory
        data_width: 32
        address_width: 29
    registers:
      - resource: registers/cyclone_v/system_manager.yaml
        name: SYSMGR
        base_address: 0xffd08000
      - resource: registers/cyclone_v/reset_manager.yaml
        name: RSTMGR
        base_address: 0xffd05000
      - resource: registers/cyclone_v/fpga_manager.yaml
        name: FPGAMGRREGS
        base_address: 0xff706000
      - resource: registers/cyclone_v/nic301.yaml
        name: L3REGS
        base_address: 0xff800000
      - resource: registers/cyclone_v/sdram.yaml
        name: SDR
        base_address: 0xffc20000
      - resource: registers/cyclone_v/fpga_manager_data.yaml
        name: FPGAMGRDATA
        base_address: 0xffb90000
      - resource: registers/cyclone_v/bridges.yaml
        name: LWFPGASLAVES
        base_address: 0xff200000
        register_window_size: 0x00200000
      - resource: registers/cyclone_v/bridges.yaml
        name: LWHPS2FPGA
        base_address: 0xff400000
        register_window_size: 0x00100000
      - resource: registers/cyclone_v/bridges.yaml
        name: HPS2FPGA
        base_address: 0xff500000
        register_window_size: 0x00100000
      - resource: registers/cyclone_v/bridges.yaml
        name: FPGA2HPS
        base_address: 0xff600000
        register_window_size: 0x00100000

  - type: program.main_mister
    name: main_mister
    software: software/main_mister.yaml
