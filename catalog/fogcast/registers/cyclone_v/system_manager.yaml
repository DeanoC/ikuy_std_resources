name: cyclone_v_system_manager
description: Observed Cyclone V HPS system-manager register slice used by Main_MiSTer.
register:
  - name: FPGAINTF
    type: rw
    width: 32
    default: 0x00000000
    offset: 0x00000000
    description: FPGA interface selection register.
    field:
      - name: VALUE
        bits: "31:0"
        type: rw
        shortdesc: Observed 32-bit register value.
  - name: ISWGRP0
    type: rw
    width: 32
    default: 0x00000000
    offset: 0x00000004
    description: Software group register slice.
    field:
      - name: VALUE
        bits: "31:0"
        type: rw
        shortdesc: Observed 32-bit register value.
