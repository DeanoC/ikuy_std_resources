name: cyclone_v_bridge_windows
description: Observed Cyclone V HPS-to-FPGA bridge windows used by Main_MiSTer.
register:
  - name: WINDOW
    type: rw
    width: 32
    default: 0x00000000
    offset: 0x00000000
    description: First word in an observed bridge window.
    field:
      - name: VALUE
        bits: "31:0"
        type: rw
        shortdesc: Bridge window payload.
